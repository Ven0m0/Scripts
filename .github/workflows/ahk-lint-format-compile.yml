name: AHK Lint & Format

on:
  push:
    branches: [main, master]
    paths: ["**/*.ahk", ".github/workflows/ahk-lint-format-compile.yml"]
  pull_request:
    branches: [main, master]
    paths: ["**/*.ahk", ".github/workflows/ahk-lint-format-compile.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Install AutoHotkey
        run: |
          choco install -y --no-progress autohotkey

      - name: Verify Installation
        run: |
          $ahk = "$env:ProgramFiles\AutoHotkey\v2\AutoHotkey64.exe"

          if (!(Test-Path $ahk)) { throw "V2 Installation failed: $ahk not found" }

          Write-Host "Installed AHK v2: $(& $ahk --version)"
      - name: Syntax Check & Format Validation
        run: |
          $ahk = "$env:ProgramFiles\AutoHotkey\v2\AutoHotkey64.exe"
          $syntaxErrors = @()
          $missingDirective = @()
          $formatIssues = @()
          $checked = 0

          Get-ChildItem -Recurse -Filter *.ahk | % {
            $checked++
            $rel = $_.FullName -replace [regex]::Escape("$(Get-Location)\"), ""
            $content = Get-Content $_.FullName -Raw -Encoding UTF8

            if ($content -notmatch "(?m)^#Requires\s+AutoHotkey\s+v2") {
              Write-Host "❌ $rel - missing #Requires AutoHotkey v2 directive" -ForegroundColor Red
              $missingDirective += $rel
            }

            # Syntax check via the documented /Validate switch
            & $ahk /ErrorStdOut=UTF-8 /Validate $_.FullName 2>&1 | Out-Null

            if ($LASTEXITCODE -eq 0) {
              Write-Host "✓ $rel" -ForegroundColor Green
            } else {
              Write-Host "❌ $rel - syntax error" -ForegroundColor Red
              $syntaxErrors += $rel
            }

            # Format check (reuses $content already read above)
            $problems = @()
            if (($content -match "(?m)^\t") -and ($content -match "(?m)^    ")) { $problems += "mixed indent" }
            if ($content -match "[ \t]+`r?`n") { $problems += "trailing space" }
            if (($content -match "`r`n") -and ($content -match "(?<!`r)`n")) { $problems += "mixed line endings" }

            if ($problems) {
              Write-Host "⚠ $rel : $($problems -join ", ")" -ForegroundColor Yellow
              $formatIssues += $rel
            }
          }

          Write-Host "`nChecked: $checked | Missing directive: $($missingDirective.Count) | Syntax errors: $($syntaxErrors.Count) | Format issues: $($formatIssues.Count)"

          if ($missingDirective) {
            Write-Host "`nMissing #Requires AutoHotkey v2 in:" -ForegroundColor Red
            $missingDirective | % { Write-Host "  $_" }
            exit 1
          }

          if ($syntaxErrors) {
            Write-Host "`nSyntax errors in:" -ForegroundColor Red
            $syntaxErrors | % { Write-Host "  $_" }
            exit 1
          }

          if ($formatIssues) {
            Write-Host "`nFormat issues in:" -ForegroundColor Yellow
            $formatIssues | % { Write-Host "  $_" }
            exit 1
          }

      - name: Run Tests
        run: |
          function Test-IsAhkV2Script {
            param(
              [Parameter(Mandatory = $true)]
              [string]$Path
            )

            $header = Get-Content -Path $Path -TotalCount 20 -ErrorAction SilentlyContinue
            return $header -match '^\s*#Requires\s+AutoHotkey\s+v2(\.0)?\b'
          }

          $ahkV2 = "$env:ProgramFiles\AutoHotkey\v2\AutoHotkey64.exe"
          $searchRoots = @("tests", "ahk", "Lib") | Where-Object { Test-Path $_ }
          $testFiles = @()

          foreach ($root in $searchRoots) {
            $testFiles += Get-ChildItem -Path $root -Recurse -Filter *.ahk -File |
              Where-Object {
                ($_.Name -like "test_*" -or $_.Name -like "*_Test.ahk") -and
                (Test-IsAhkV2Script -Path $_.FullName)
              }
          }

          $failed = @()

          if (-not $testFiles) {
            Write-Host "No AutoHotkey v2 test files found under tests/ or ahk/."
            exit 0
          }

          foreach ($tf in $testFiles) {
            $rel = $tf.FullName -replace [regex]::Escape("$(Get-Location)\"), ""
            $proc = Start-Process -FilePath $ahkV2 -ArgumentList "`"$($tf.FullName)`"" -PassThru -NoNewWindow
            if (!$proc.WaitForExit(30000)) {
              $proc.Kill()
              Write-Host "❌ $rel - timed out" -ForegroundColor Red
              $failed += $rel
            } elseif ($proc.ExitCode -ne 0) {
              Write-Host "❌ $rel - exit $($proc.ExitCode)" -ForegroundColor Red
              $failed += $rel
            } else {
              Write-Host "✓ $rel" -ForegroundColor Green
            }
          }

          Write-Host "`nRan: $($testFiles.Count) | Failed: $($failed.Count)"

          if ($failed) {
            Write-Host "`nFailed tests:" -ForegroundColor Red
            $failed | % { Write-Host "  $_" }
            exit 1
          }

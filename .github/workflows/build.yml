name: Build and Release

on:
  workflow_dispatch:
  push:
    tags: ["v*", "*-v*"]

permissions:
  contents: read

jobs:
  plan:
    runs-on: windows-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7

      - name: Derive build matrix from tag
        id: plan
        run: |
          $tag = "${{ github.ref_name }}"
          $group = if ($tag -match '^(.+)-v[0-9]') { $Matches[1] } else { $null }

          $scripts = Get-ChildItem -Path ahk -Recurse -Filter *.ahk -File | Where-Object {
            $_.Name -notmatch '^test_|_Test\.ahk$'
          }

          $include = $scripts | ForEach-Object {
            $rel = $_.FullName -replace [regex]::Escape("$(Get-Location)\"), '' -replace '\\', '/'
            $parts = $rel -split '/'
            # ahk/<Name>.ahk -> core ; ahk/<Dir>/<Name>.ahk -> <dir> lowercased
            $itemGroup = if ($parts.Count -eq 2) { 'core' } else { $parts[1].ToLowerInvariant() }
            [PSCustomObject]@{
              name  = $_.BaseName
              in    = $rel
              group = $itemGroup
            }
          }

          if ($group) {
            $matched = $include | Where-Object { $_.group -eq $group }
            if (-not $matched) {
              throw "Tag prefix '$group' (from '$tag') matches no script group. Known groups: $(($include.group | Sort-Object -Unique) -join ', ')"
            }
            $include = $matched
          }

          if (-not $include) {
            throw "No scripts resolved for tag '$tag'."
          }

          $matrixJson = @{ include = $include } | ConvertTo-Json -Compress -Depth 4
          Write-Host "Matrix: $matrixJson"
          "matrix=$matrixJson" >> $env:GITHUB_OUTPUT

  compile:
    needs: plan
    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7

      - name: Build exe
        uses: MohamedSaidSallam/AHK2Exe-GitHub-Action@v1
        with:
          in: ${{ matrix.in }}
          out: dist/${{ matrix.name }}_${{ github.ref_name }}.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: exe-${{ matrix.name }}
          path: dist/*.exe

  release:
    needs: compile
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: exe-*
          path: dist
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*.exe
          fail_on_unmatched_files: true
